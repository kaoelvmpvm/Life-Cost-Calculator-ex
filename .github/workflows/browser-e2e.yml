name: Browser E2E
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/jingcai-test-server.log 2>&1 &
          trap 'kill $!' EXIT
          npx playwright test tests/e2e.spec.cjs --reporter=line
      - name: Upload debug artifacts if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
